name: Update Flight Prices and Plot

on:
  schedule:
    # Runs every 3 hours (at 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '30 */2 * * *'
  workflow_dispatch: # Allows you to trigger a manual run anytime from the Actions tab

permissions:
  contents: write # Required so the workflow can push updated DB and HTML back to the repo

jobs:
  track-and-plot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests pyyaml pandas plotly

      - name: Run flight price tracker
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          python tracker.py

      - name: Generate updated Plotly chart
        run: |
          python plots.py

      - name: Commit and push updated data and chart
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add prices.db execution.log *.html
          git diff --staged --quiet || git commit -m "Auto-update flight prices and chart"
          git push
