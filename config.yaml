search_config:
  engine: google_flights
  currency: CHF # Optional: USD, EUR, CHF, etc.
  hl: en # Interface language

travelers:
  adults: 2
  children: 3 # Ages 2-11 (add infants_in_seat / infants_on_lap if under 2)

baggage:
  # Note: SerpApi's `bags` parameter ONLY counts carry-on bags (max 1 per passenger).
  # Checked bags and weight (23kg) cannot be filtered in the request;
  # you must check `extensions` or `baggage_prices` in the API response.
  carry_on_bags: 5
  exclude_basic_economy: true # Helpful to avoid fares without checked bags

# Use multi-city legs (maps to SerpApi's `multi_city_json`)
segments:
  - name: "IST-CMB"
    type: 2
    date: "2027-04-17"
    departure_id: IST
    arrival_id: CMB
    include_airlines: TK
    target_flight_number: "TK 1130"

  - name: "CMB-HEL"
    type: 2
    date: "2027-06-15"
    departure_id: CMB
    arrival_id: HEL
    include_airlines: TK
    target_flight_number:
      - "TK 1131"
      - "TK 1763"

  - name: "IST-CMB-HEL (Multi-City)"
    type: 3
    include_airlines: TK
    legs:
      - date: "2027-04-17"
        departure_id: IST
        arrival_id: CMB
        target_flight_number: "TK 1130"
      - date: "2027-06-15"
        departure_id: CMB
        arrival_id: HEL
        target_flight_number:
          - "TK 1131"
          - "TK 1763"

